[package]
name = "lazykasten"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.8.1"
global-hotkey = "0.9"
tray-icon = "0.26"
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
chrono = "0.4"
dirs = "6"
async-channel = "2"
notify = "8.2"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
